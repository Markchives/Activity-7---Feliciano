{% extends "base.html" %}
{% block content %}
<section style="max-width:440px;margin:40px auto;padding:28px;border:1px solid #d9dee7;border-radius:8px;background:#ffffff;">
  <div style="margin-bottom:24px;text-align:center;">
    <p style="margin:0 0 8px;color:#6b7280;font-size:.8rem;font-weight:700;letter-spacing:1px;">PASSWORD RESET</p>
    <h1 style="margin:0 0 8px;">Enter New Password</h1>
    <p style="margin:0;color:#6b7280;">Your email has been verified. Choose a new password for your account.</p>
  </div>
  <form method="post" style="display:grid;gap:16px;">
    <label for="new_password" style="font-weight:700;">New Password</label>
    <input id="new_password" name="new_password" type="password" required autofocus style="box-sizing:border-box;width:100%;padding:12px;border:1px solid #b8c0cc;border-radius:4px;">
    <label for="confirm_password" style="font-weight:700;">Confirm New Password</label>
    <input id="confirm_password" name="confirm_password" type="password" required style="box-sizing:border-box;width:100%;padding:12px;border:1px solid #b8c0cc;border-radius:4px;">
    <button type="submit" style="padding:12px 16px;border:1px solid #1769aa;border-radius:4px;background:#1769aa;color:#ffffff;font-weight:700;cursor:pointer;">Change Password</button>
  </form>
  <div style="margin-top:20px;text-align:center;">
    <a href="{{ url_for('login') }}" style="font-size:.9rem;color:#1769aa;text-decoration:none;font-weight:700;">&larr; Back to Login</a>
  </div>
</section>
{% endblock %}
