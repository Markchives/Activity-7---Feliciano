{% extends "base.html" %}
{% block content %}
<section style="max-width:440px;margin:40px auto;padding:28px;border:1px solid #d9dee7;border-radius:8px;background:#ffffff;">
  <div style="margin-bottom:24px;text-align:center;">
    <p style="margin:0 0 8px;color:#6b7280;font-size:.8rem;font-weight:700;letter-spacing:1px;">TWO-STEP VERIFICATION</p>
    <h1 style="margin:0 0 8px;">Verify Your Email</h1>
    <p style="margin:0;color:#6b7280;">Enter the 6-digit code sent to your email address.</p>
  </div>
  <form method="post" action="{{ action_url }}" style="display:grid;gap:16px;">
    <label for="otp_code" style="font-weight:700;">Enter 6-Digit Code</label>
    <input id="otp_code" name="otp_code" maxlength="6" pattern="[0-9]{6}" inputmode="numeric" placeholder="123456" required autofocus style="box-sizing:border-box;width:100%;padding:12px;border:1px solid #b8c0cc;border-radius:4px;letter-spacing:4px;font-size:1.2rem;font-weight:700;text-align:center;">
    <button type="submit" style="padding:12px 16px;border:1px solid #1769aa;border-radius:4px;background:#1769aa;color:#ffffff;font-weight:700;cursor:pointer;">Verify Code &rarr;</button>
  </form>
  <div style="margin-top:20px;text-align:center;">
    <a href="{{ url_for('login') }}" style="font-size:.9rem;color:#1769aa;text-decoration:none;font-weight:700;">&larr; Back to Login</a>
  </div>
</section>
{% endblock %}
