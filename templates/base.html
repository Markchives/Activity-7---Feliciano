<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campus Hardware Inventory</title>
  <link rel="stylesheet" href="{{ url_for('styles') }}">
</head>
<body>
<header class="site-header">
  <a class="brand" href="{{ url_for('index') }}" aria-label="Campus Hardware Inventory home">
    <span class="brand-mark" aria-hidden="true">CHI</span>
    <strong>Campus Hardware <span>Inventory</span></strong>
  </a>
  {% if session.username %}
  <div class="account-menu">
    <div class="account-details">
      <span class="account-name">{{ session.username }}</span>
      <span class="account-role">{{ session.role }}</span>
    </div>
    <a class="logout-link" href="{{ url_for('logout') }}">Logout</a>
  </div>
  {% endif %}
</header>
<main>
{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}
{% block content %}{% endblock %}
</main>
</body>
</html>
