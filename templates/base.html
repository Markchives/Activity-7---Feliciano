<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campus Hardware Inventory</title>
  <link rel="stylesheet" href="{{ url_for('styles') }}">
</head>
<body>
<header><strong>Campus Hardware Inventory</strong>{% if session.username %}<span>{{ session.username }} · {{ session.role }} · <a href="{{ url_for('logout') }}">Logout</a></span>{% endif %}</header>
<main>
{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}
{% block content %}{% endblock %}
</main>
</body>
</html>
